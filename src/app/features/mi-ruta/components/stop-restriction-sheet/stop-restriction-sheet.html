<div class="backdrop" (click)="onClose()"></div>

<section class="sheet" role="dialog" aria-label="Restricción de la parada">
  <header class="sheet__head">
    <div>
      <p class="sheet__eyebrow">Restricción · {{ stop().orderId }}</p>
      <h2 class="sheet__title">{{ stop().clientName }}</h2>
    </div>
    <button type="button" class="sheet__close" (click)="onClose()" aria-label="Cerrar">
      <app-icon name="x" />
    </button>
  </header>

  @if (hasExistingRestriction()) {
    <div class="current">
      @if (windowLabel(); as label) {
        <span class="chip chip--window"><app-icon name="clock" /> {{ label }}</span>
      }
      @if (stop().priority === 'ALTA') {
        <span class="chip chip--priority"><app-icon name="star" /> Prioridad alta</span>
      }
    </div>
  }

  <label class="field">
    <span class="field__label">¿Qué necesitas para esta parada?</span>
    <textarea
      class="field__input"
      rows="3"
      placeholder="Ej. Entregar entre 11:00 y 14:00 · Recoger después de las 16:00 · Este va primero"
      [ngModel]="noteText()"
      (ngModelChange)="noteText.set($event)"
      [disabled]="saving()"
    ></textarea>
    <span class="field__hint">
      Se interpreta el horario y la prioridad de tu nota. Los tiempos de viaje siempre los calcula el mapa.
    </span>
  </label>

  <div class="sheet__actions">
    <button
      type="button"
      class="of-btn of-btn--primary"
      [disabled]="saving() || !noteText().trim()"
      (click)="onSave()"
    >
      {{ saving() ? 'Guardando…' : 'Guardar restricción' }}
    </button>

    @if (hasExistingRestriction()) {
      <button type="button" class="of-btn of-btn--danger" [disabled]="saving()" (click)="onRemove()">
        Quitar restricción
      </button>
    }
  </div>
</section>
